[conversion]
# Sections to skip during conversion (comma-separated list)
# Use 'none' to skip no sections
# Default sections: Historia de Versiones, Indice
skip_sections = Historia de Versiones, Indice

# Extract images from PDF
# Set to true to extract and save images, false to skip image extraction
extract_images = true

# Preserve hyperlinks from PDF
# Set to true to preserve links as markdown links or comments
preserve_links = true

# Example configurations:
# skip_sections = Historia de Versiones, Indice, Referencias
# skip_sections = none
# skip_sections = Table of Contents, Version History, Index
# extract_images = false
# preserve_links = false
